name: Coatria checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: coatria-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-sandbox-linux:
    # A VM is required: an ordinary job container cannot delegate host cgroups or
    # prove the same user/pid/net namespace boundary as the intended worker host.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # Disposable local metadata only; these credentials never enter the
        # credential-free qualifier or the installed reference worker.
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: coatria_test
          POSTGRES_PASSWORD: local_ci_test_only
          POSTGRES_DB: coatria_reference_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coatria_test -d coatria_reference_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck media qualification and diagnostic modules
        run: node node_modules/typescript/bin/tsc --noEmit --allowJs --allowImportingTsExtensions --strict --skipLibCheck --target ES2022 --module esnext --moduleResolution bundler --esModuleInterop scripts/hosting/media-sandbox-linux-canary.mts scripts/hosting/media-sandbox-startup-diagnostic.test.mts scripts/hosting/reference-worker-linux-canary.test.mts scripts/hosting/image-preparation-linux-canary.test.mts scripts/hosting/run-archive-host.mts scripts/hosting/qualify-reference-host.mts scripts/hosting/qualify-image-preparation-host.mts scripts/hosting/run-image-preparation-worker.mts scripts/hosting/register-reference-host.mts scripts/hosting/register-image-preparation-host.mts tests/image-preparation-host-enrollment.test.ts tests/image-preparation-registrar.test.ts tests/archive-host-package.test.ts tests/reference-host-package.test.ts tests/reference-host-qualification.test.ts tests/image-preparation-host-qualification.test.ts tests/image-preparation-host-package.test.ts tests/image-preparation-runner.test.ts tests/reference-host-enrollment.test.ts tests/reference-enrollment-transaction.test.ts tests/reference-enrollment-postgres.test.ts
      - name: Test bounded diagnostic classification and fail-closed invocation
        run: node --import tsx --test scripts/hosting/media-sandbox-startup-diagnostic.test.mts scripts/hosting/reference-worker-linux-canary.test.mts scripts/hosting/image-preparation-linux-canary.test.mts scripts/hosting/media-apparmor-ci.test.mjs scripts/hosting/reference-host-ci.test.mjs scripts/hosting/image-preparation-host-ci.test.mjs scripts/hosting/reference-enrollment-ci.test.mjs
      - name: Prepare pinned closure and one capped delegated service
        run: |
          sudo env CI=true COATRIA_TEST_UID="$(id -u)" COATRIA_TEST_GID="$(id -g)" GITHUB_ENV="$GITHUB_ENV" "$(command -v node)" scripts/hosting/prepare-media-sandbox-ci.mjs
      - name: Verify registrar journal crash recovery and actual root credential permissions
        run: |
          sudo env CI=true "$(command -v node)" --import tsx --test tests/image-preparation-host-enrollment.test.ts
      - name: Drop privilege and prove the real isolation boundary and seven decoders
        run: |
          sudo env CI=true COATRIA_MEDIA_QUALIFICATION="$COATRIA_MEDIA_QUALIFICATION" "$(command -v node)" scripts/hosting/run-media-sandbox-ci.mjs
      - name: Build the exact archive release and qualify its disabled systemd service
        run: |
          sudo env CI=true GITHUB_SHA="$GITHUB_SHA" COATRIA_MEDIA_QUALIFICATION="$COATRIA_MEDIA_QUALIFICATION" COATRIA_NPM_CACHE="$(npm config get cache)" "$(command -v node)" scripts/hosting/qualify-archive-host-ci.mjs
      - name: Qualify the exact reference-only install twice without enrollment or credentials
        run: |
          sudo env CI=true GITHUB_SHA="$GITHUB_SHA" COATRIA_MEDIA_QUALIFICATION="$COATRIA_MEDIA_QUALIFICATION" COATRIA_NPM_CACHE="$(npm config get cache)" "$(command -v node)" scripts/hosting/qualify-reference-host-ci.mjs
      - name: Exercise the compiled registrar against installed qualification and local restricted PostgreSQL
        run: |
          sudo env CI=true GITHUB_SHA="$GITHUB_SHA" COATRIA_MEDIA_QUALIFICATION="$COATRIA_MEDIA_QUALIFICATION" "$(command -v node)" scripts/hosting/qualify-reference-enrollment-ci.mjs
      - name: Qualify the exact image-preparation install twice with separate binary evidence
        run: |
          sudo env CI=true GITHUB_SHA="$GITHUB_SHA" COATRIA_MEDIA_QUALIFICATION="$COATRIA_MEDIA_QUALIFICATION" COATRIA_NPM_CACHE="$(npm config get cache)" "$(command -v node)" --import tsx scripts/hosting/qualify-image-preparation-host-ci.mjs
      - name: Preserve scoped AppArmor mode and sanitized kernel denial categories
        if: always() && env.COATRIA_MEDIA_QUALIFICATION != ''
        run: |
          sudo env CI=true COATRIA_MEDIA_QUALIFICATION="$COATRIA_MEDIA_QUALIFICATION" "$(command -v node)" scripts/hosting/collect-media-apparmor-ci.mjs
      - name: Preserve pinned Linux isolation and media evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coatria-linux-media-sandbox-${{ github.run_id }}
          path: .devdata/media-sandbox-linux/evidence
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  renderer-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Same reviewed Node 24.19.0 bookworm-slim linux/amd64 runtime as the Pod bootstrap.
      image: node@sha256:e5a8dee7bc1e6a215d224a7ef8206f7e77271bc3cabd5febf2beafac0674f174
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify official Blender and install the isolated locked renderer runtime
        run: node scripts/hosting/prepare-renderer-canary.mjs
      - name: Render and decode a small actual procedural EXR sequence
        working-directory: .devdata/renderer-linux-canary/app
        env:
          COATRIA_BLENDER_PATH: ${{ github.workspace }}/.devdata/renderer-linux-canary/blender/blender
          COATRIA_RENDER_CANARY_OUTPUT: ${{ github.workspace }}/.devdata/renderer-linux-canary/evidence
        run: node --import tsx scripts/hosting/renderer-linux-canary.mts
      - name: Preserve synthetic native scene, frames, preview and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coatria-linux-renderer-${{ github.run_id }}
          path: .devdata/renderer-linux-canary/evidence
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: coatria_test
          POSTGRES_PASSWORD: local_ci_test_only
          POSTGRES_DB: coatria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coatria_test -d coatria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://coatria_test:local_ci_test_only@127.0.0.1:5432/coatria_test
      COATRIA_INTEGRATION_DATABASE_URL: postgresql://coatria_test:local_ci_test_only@127.0.0.1:5432/coatria_test
      APP_URL: http://localhost:4180
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      # Official stable refs and Node 24 action runtimes verified on 2026-09-08.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: node scripts/check-secrets.mjs --history
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:migrate
      - name: Prepare checksum-pinned native media inspection tools
        run: node scripts/hosting/prepare-media-inspector-ci.mjs
      - name: Install Chromium for the synthetic production-workspace browser lane
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm test
      - run: npm run test:agent:fixture
      - run: npm run typecheck
      - name: Build standalone trusted services from the exact reviewed checkout
        run: |
          node --input-type=module <<'NODE'
          import {mkdir} from 'node:fs/promises';
          import {join} from 'node:path';
          import {buildTrustedServiceBundle} from './scripts/hosting/build-trusted-service-bundle.mjs';
          const output=join(process.env.RUNNER_TEMP,'coatria-trusted-services');
          await mkdir(output);
          for(const service of ['archive','gateway','reference','reference-qualification','reference-registrar','media-qualification','image-preparation','image-preparation-qualification','image-preparation-registrar']) {
            const result=await buildTrustedServiceBundle({root:process.cwd(),commit:process.env.GITHUB_SHA,service,output:join(output,service)});
            console.log(JSON.stringify({service,sourceCommit:result.sourceCommit,bundleSha256:result.bundleSha256,runtimeBytes:result.runtime.bytes,qualified:false,providerCalled:false}));
          }
          NODE
      - run: npm run build
      - name: Exercise generated-media and legacy studio workflows in the production build
        env:
          COATRIA_BROWSER_START: '1'
          COATRIA_TEST_URL: http://127.0.0.1:4180
        run: node node_modules/@playwright/test/cli.js test tests/browser/studio-generated.spec.ts tests/browser/studio-generated-workflow.spec.ts tests/browser/studio-generated-coordination.spec.ts tests/browser/studio-generated-client.spec.ts tests/browser/studio-generated-revisions.spec.ts tests/browser/generated-project-wizard.spec.ts tests/browser/studio-roles.spec.ts tests/browser/higgsfield-archives.spec.ts tests/browser/higgsfield-tracking.spec.ts tests/browser/higgsfield-references.spec.ts tests/browser/project-image-preparations.spec.ts tests/browser/studio-task-handoff.spec.ts tests/browser/trusted-media-services.spec.ts tests/browser/project-storage-revoke.spec.ts
      - name: Preserve synthetic studio browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coatria-studio-browser-${{ github.run_id }}
          path: test-results
          retention-days: 14
          if-no-files-found: ignore
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: coatria_test
          POSTGRES_PASSWORD: local_ci_test_only
          POSTGRES_DB: coatria_load_${{ github.run_id }}_${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coatria_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: local_ci_test_only
      PGDATABASE: coatria_load_${{ github.run_id }}_${{ github.run_attempt }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test 50 actual HTTP sessions against production Next and PostgreSQL
        run: |
          node --input-type=module <<'NODE'
          import {parseLoadOptions,runOfficeLoad} from './scripts/load-office.mjs';
          const database=new URL('postgresql://127.0.0.1:5432');
          database.username='coatria_test';
          database.password=process.env.PGPASSWORD;
          database.pathname=process.env.PGDATABASE;
          process.env.COATRIA_LOAD_DATABASE_URL=database.href;
          const report=await runOfficeLoad(parseLoadOptions(['--mode','production','--clients','50','--duration','60','--diagnostics','true','--report','load-reports/connections.json']));
          // Preserve the existing correctness and 1,000 ms p95 gate. Missing
          // diagnostic coverage is a separate failure, never a latency waiver.
          process.exitCode=report.summary.passed&&report.diagnostics?.requiredCoverage?.passed===true?0:1;
          NODE
      - name: Publish sanitized connection report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coatria-connections-${{ github.run_id }}
          path: load-reports/connections.json
          retention-days: 14
          if-no-files-found: warn
